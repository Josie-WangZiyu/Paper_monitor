<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Monitor | 声学文献追踪</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --card-bg: #161b22;
      --tag-bg: #21262d;
      --tag-border: #30363d;
      --success: #3fb950;
      --warning: #d29922;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo svg { width: 28px; height: 28px; }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Search & Filter */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 250px;
      max-width: 500px;
    }
    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }
    .journal-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .filter-btn {
      padding: 0.4rem 0.9rem;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active {
      background: rgba(88, 166, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Stats */
    .stats-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    /* Main Content */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      padding: 4rem 2rem;
      color: #f85149;
    }

    /* Paper Cards */
    .paper-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .paper-grid { grid-template-columns: 1fr; }
      header, main { padding-left: 1rem; padding-right: 1rem; }
    }

    .paper-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: border-color 0.2s, transform 0.15s;
      display: flex;
      flex-direction: column;
    }
    .paper-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .journal-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .tag-jasa { background: rgba(47, 129, 247, 0.15); color: #58a6ff; }
    .tag-jsv { background: rgba(35, 197, 94, 0.15); color: #3fb950; }
    .tag-app-acoustics { background: rgba(210, 153, 34, 0.15); color: #d29922; }
    .tag-aes { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }
    .tag-arxiv { background: rgba(139, 148, 158, 0.15); color: #8b949e; }
    .tag-other { background: rgba(139, 148, 158, 0.15); color: #8b949e; }

    .date {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }
    .title a:hover { color: var(--accent-hover); }

    .authors {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }

    .abstract {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
      flex: 1;
    }
    .abstract.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .expand-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
    }
    .expand-btn:hover { text-decoration: underline; }
    .doi-link {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .doi-link:hover { text-decoration: underline; }
    .doi-link svg { width: 14px; height: 14px; }

    .no-results {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          Paper Monitor
        </div>
        <div class="subtitle">声学/音频领域最新文献追踪</div>
      </div>
      <div class="controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索标题、作者、摘要关键词...">
        </div>
        <div class="journal-filters" id="journalFilters"></div>
      </div>
    </div>
  </header>

  <div class="stats-bar">
    <span id="statsText">加载中...</span>
    <span id="updateTime"></span>
  </div>

  <main>
    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p>正在加载文献数据...</p>
    </div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="papersContainer" class="paper-grid" style="display:none;"></div>
    <div id="noResults" class="no-results" style="display:none;">
      <p>没有找到匹配的文献</p>
    </div>
  </main>

  <footer>
    <p>数据来源: JASA, JSV, Applied Acoustics, AES, arXiv | 
    <a href="#" target="_blank" id="githubLink">GitHub</a></p>
    <script>
      // Auto-detect GitHub repo from Pages URL
      (function(){
        var host = location.host;
        var path = location.pathname.split('/').filter(Boolean);
        if (host.endsWith('.github.io') && path.length > 0) {
          var user = host.replace('.github.io', '');
          document.getElementById('githubLink').href = 'https://github.com/' + user + '/' + path[0];
        } else {
          document.getElementById('githubLink').href = 'https://github.com';
        }
      })();
    </script>
  </footer>

  <script>
    const JOURNAL_STYLES = {
      'JASA': 'tag-jasa',
      'JSV': 'tag-jsv',
      'App. Acoustics': 'tag-app-acoustics',
      'AES': 'tag-aes',
      'arXiv': 'tag-arxiv'
    };

    let allPapers = [];
    let activeFilter = 'all';

    async function loadData() {
      try {
        const response = await fetch('data/papers.json?t=' + Date.now());
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        allPapers = data.papers || [];
        updateStats(data.last_updated);
        renderFilters();
        renderPapers();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('papersContainer').style.display = '';
      } catch (err) {
        console.error(err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = '';
        document.getElementById('error').textContent = '加载数据失败: ' + err.message;
      }
    }

    function updateStats(lastUpdated) {
      const total = allPapers.length;
      const jounals = [...new Set(allPapers.map(p => p.journal))];
      document.getElementById('statsText').textContent = 
        `共收录 ${total} 篇文献 | ${jounals.length} 个来源`;
      if (lastUpdated) {
        const d = new Date(lastUpdated);
        document.getElementById('updateTime').textContent = 
          '更新于 ' + d.toLocaleString('zh-CN');
      }
    }

    function renderFilters() {
      const journals = [...new Set(allPapers.map(p => p.journal))];
      const container = document.getElementById('journalFilters');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = '全部';
      allBtn.onclick = () => setFilter('all');
      container.appendChild(allBtn);

      journals.forEach(j => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = j;
        btn.onclick = () => setFilter(j);
        container.appendChild(btn);
      });
    }

    function setFilter(journal) {
      activeFilter = journal;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', 
          (journal === 'all' && btn.textContent === '全部') || btn.textContent === journal
        );
      });
      renderPapers();
    }

    function getSearchQuery() {
      return document.getElementById('searchInput').value.toLowerCase().trim();
    }

    function renderPapers() {
      const query = getSearchQuery();
      const filtered = allPapers.filter(p => {
        const matchJournal = activeFilter === 'all' || p.journal === activeFilter;
        if (!matchJournal) return false;
        if (!query) return true;
        const text = (p.title + ' ' + p.authors + ' ' + p.abstract).toLowerCase();
        return text.includes(query);
      });

      const container = document.getElementById('papersContainer');
      const noResults = document.getElementById('noResults');

      if (filtered.length === 0) {
        container.style.display = 'none';
        noResults.style.display = '';
        return;
      }

      container.style.display = '';
      noResults.style.display = 'none';
      container.innerHTML = filtered.map(p => renderCard(p)).join('');
    }

    function renderCard(paper) {
      const tagClass = JOURNAL_STYLES[paper.journal] || 'tag-other';
      const hasAbstract = paper.abstract && paper.abstract.length > 20;
      const abstractId = 'abs-' + paper.id;
      const doiUrl = paper.doi && !paper.doi.startsWith('arXiv') 
        ? 'https://doi.org/' + paper.doi 
        : (paper.url || '#');

      return `
        <article class="paper-card">
          <div class="card-header">
            <span class="journal-tag ${tagClass}">${paper.journal}</span>
            <span class="date">${paper.published || '日期未知'}</span>
          </div>
          <h3 class="title">
            <a href="${paper.url || '#'}" target="_blank" rel="noopener">${escapeHtml(paper.title)}</a>
          </h3>
          <div class="authors">${escapeHtml(paper.authors)}</div>
          ${hasAbstract ? `
            <div class="abstract collapsed" id="${abstractId}">${escapeHtml(paper.abstract)}</div>
            <div class="card-footer">
              <button class="expand-btn" onclick="toggleAbstract('${abstractId}', this)">展开摘要</button>
              <a class="doi-link" href="${doiUrl}" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                查看原文
              </a>
            </div>
          ` : `
            <div class="card-footer" style="justify-content: flex-end; margin-top: auto;">
              <a class="doi-link" href="${doiUrl}" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                查看原文
              </a>
            </div>
          `}
        </article>
      `;
    }

    function toggleAbstract(id, btn) {
      const el = document.getElementById(id);
      const isCollapsed = el.classList.contains('collapsed');
      el.classList.toggle('collapsed');
      btn.textContent = isCollapsed ? '收起摘要' : '展开摘要';
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', renderPapers);

    // Load on start
    loadData();
  </script>
</body>
</html>
